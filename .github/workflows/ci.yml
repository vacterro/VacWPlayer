name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + pyflakes
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes==3.4.0

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint (pyflakes)
        shell: bash
        run: python -m pyflakes *.py *.pyw tabs/*.py tests/*.py
